[zone.potrero]
start = [37.7597, -122.4037]   # 20th & Kansas, approximate: M1 snaps it to the OSM intersection
route = "downhill to the bus stop at the bottom"
radius_m = 700

[library]
directions_deg = [202.5, 225, 247.5, 270, 292.5, 315, 337.5, 360]
ref_speed_ms = 5
check_speed_ms = 10
fog_bands_m = [[0, 150], [150, 300], [300, 500], [500, 800]]
# guide 01: 11 finer inflow bands; they add up exactly to the 4 above (effective 0-140, 140-300, 300-500, 500-800)
fog_bands3d_m = [[0, 40], [40, 100], [100, 140], [140, 200], [200, 260], [260, 300], [300, 360], [360, 420], [420, 500], [500, 640], [640, 800]]
