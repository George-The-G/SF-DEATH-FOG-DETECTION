eddy_diffusivity_v_m2s = 8.0
fog_loss_per_km = 0.0
deposition_velocity_ms = 0.02

[replay]
fog_nights = 7
dry_nights = 2
step_min = 10
fog_frame_min = 30

[viewer]
max_mb = 10
