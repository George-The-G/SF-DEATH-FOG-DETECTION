name: collect

# Runs the whole tool on GitHub: fetch weather, score the zones, send alerts, publish the status page.
# State (database, baseline) lives on the `data` branch as a single force-pushed commit.
on:
  schedule:
    - cron: "*/10 * * * *"        # GitHub may start runs a few minutes late; that is fine for fog
    - cron: "7,37 * * * *"        # live fog data (v3): the full live build runs on this one; the */10 runs reuse the last published live output
  workflow_dispatch:
    inputs:
      rebuild_baseline:
        description: "Rebuild the 30-day baseline from scratch"
        type: boolean
        default: false

permissions:
  contents: write                  # push the `data` branch

concurrency:
  group: deathfog-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20             # the live build (about 3 to 4 minutes) runs inside this job
    env:
      DEATHFOG_DATA_DIR: state
      DEATHFOG_SITE_DIR: site
      DEATHFOG_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      # Optional secrets/variables: the page works without any of them.
      DEATHFOG_USER_AGENT: ${{ secrets.DEATHFOG_USER_AGENT || format('(deathfog-sf, {0}/{1})', github.server_url, github.repository) }}
      DEATHFOG_NTFY_TOPIC: ${{ secrets.DEATHFOG_NTFY_TOPIC }}
      DEATHFOG_REPORT_URL: ${{ vars.DEATHFOG_REPORT_URL }}
      DEATHFOG_FORM_CSV_URL: ${{ vars.DEATHFOG_FORM_CSV_URL }}
      PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}   # only read when [sources.purpleair] is enabled
      REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - name: Restore state from the data branch
        run: bash scripts/state_restore.sh state

      - name: Backfill the 30-day baseline (first run, or when asked)
        run: |
          if [ "${{ inputs.rebuild_baseline }}" = "true" ]; then
            python3 run.py baseline
          else
            python3 run.py baseline --if-missing
          fi

      - name: Download street data for the map (first run, or when zones change)
        timeout-minutes: 5
        continue-on-error: true
        run: python3 run.py streets --if-missing

      - name: Collect, score, alert
        run: python3 run.py collect

      - name: Build the status page
        run: python3 run.py site

      - name: Summary
        run: |
          {
            echo '### Current scores'
            echo '```'
            python3 run.py evaluate | grep -v '^    ' || true
            echo '```'
            echo '### 30-day baseline'
            echo '```'
            python3 run.py baseline --show || echo "not built yet"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save state to the data branch
        run: bash scripts/state_save.sh state

      - name: Add the v3 test page (copied from the v3-dev branch; never blocks v2)
        continue-on-error: true
        run: |
          git fetch --depth=1 origin v3-dev
          git archive FETCH_HEAD site/v3 | tar -x

      # Live fog data for /v3/. Code and scripts come from the v3-dev branch (like site/v3), so main stays small.
      # The build runs on the 7,37 cron and on manual runs; every other run only carries the last published live output into this deploy.
      # Never blocks v2 (continue-on-error). Switch it off without a code change: repo variable DEATHFOG_LIVE = false.
      - name: Live fog data, Python (build runs only)
        if: vars.DEATHFOG_LIVE != 'false' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '7,37 * * * *')
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Live fog data, static tables cache (build runs only)
        if: vars.DEATHFOG_LIVE != 'false' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '7,37 * * * *')
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: live_static
          key: live-static-v1

      - name: Live fog data
        if: vars.DEATHFOG_LIVE != 'false'
        continue-on-error: true
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin v3-dev
          git archive FETCH_HEAD live_ci microclimate | tar -x
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "7,37 * * * *" ]; then
            bash live_ci/refresh.sh build
          else
            bash live_ci/refresh.sh reuse
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
