<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Death Fog 3D</title>
<meta name="description" content="Overnight wet-street replay for skate routes in San Francisco (Potrero Hill District, Sunset District): a 5 m proof-of-concept simulation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230b1020%27/%3E%3Cpath d=%27M8 21a4 4 0 0 1-.5-8 6 6 0 0 1 11.4-1.2A4.6 4.6 0 0 1 20 21Z%27 fill=%27none%27 stroke=%27%235ef2ff%27 stroke-width=%272%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27M9 25h14%27 stroke=%27%235ef2ff%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script>if (!/[?&]ui=1(&|$)/.test(location.search)) document.body.classList.add('ui2');</script>
<header id="top">
  <button id="rbtn" type="button" class="chip accent" aria-haspopup="listbox" aria-expanded="false" aria-controls="rpop">
    <span class="sw" id="rsw"></span>
    <span class="tx"><span id="rlabel" class="nm">Whole city</span><span id="rstat" class="st">No route selected</span></span>
    <span class="car">&#9662;</span>
  </button>
  <div id="flypill" class="chip accent" hidden>
    <div class="fp-row">
      <span class="fp-st" id="fpst"></span>
      <span class="fp-w" id="fpw"></span>
      <button id="flyspeed" type="button" class="spd" data-s="1" aria-label="Fly speed 1x">1x</button>
    </div>
    <i id="flyprog"><b id="flyfill"></b></i>
  </div>
  <button id="flypause" type="button" class="pb" aria-label="Pause" hidden></button>
  <button id="flytake" type="button" class="take" hidden aria-label="Take control: skate the street yourself">Take control</button>
  <button id="flyhdr" type="button" class="pb" aria-label="Fly the route" title="Fly the route">
    <span class="ic" aria-hidden="true"></span>
    <span class="xi" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Exit</span>
  </button>
  <button id="poc" type="button" class="poc" data-no-info aria-label="Proof of concept, 5 m simulation, not a forecast. Open: how this works"><span class="pill">Proof of concept &middot; <span class="nc">5 m</span> simulation &middot; not a forecast</span></button>
</header>

<main id="mid">
  <div id="stage">
    <canvas id="gl" aria-label="3-D view of San Francisco terrain, buildings and street wetness"></canvas>
    <div id="labels"></div>
    <div id="badge" hidden>Mock data</div>
    <button id="sheettab" type="button" aria-label="Show or hide the settings panel" aria-expanded="true"><span aria-hidden="true">&#9656;</span></button>

    <div id="rpop" role="dialog" aria-label="Choose a skate route" hidden>
      <div id="rlist" role="listbox"></div>
    </div>
  </div>
</main>

<div id="dock">
  <aside id="sheet" aria-label="Settings" hidden>
    <div class="grab" aria-hidden="true"></div>
    <div class="two sec">
      <div><h4>Night</h4><select id="night" aria-label="Night"></select></div>
      <div><h4>Speed</h4><div class="seg" id="speed" role="group" aria-label="Speed"><button type="button" data-s="1" class="on">1x</button><button type="button" data-s="4">4x</button><button type="button" data-s="16">16x</button></div></div>
    </div>
    <div class="sec">
      <h4>Layers</h4>
      <div class="tgs">
        <label><input type="checkbox" id="fogtoggle" checked><span>Fog</span></label>
        <label><input type="checkbox" id="bldtoggle" checked><span>Buildings</span></label>
        <label class="ribonly"><input type="checkbox" id="disttoggle" checked><span>District streets</span></label>
      </div>
      <div class="dens"><label for="fogdens">Fog density</label><input type="range" id="fogdens" min="30" max="200" value="100" aria-label="Fog density"></div>
    </div>
  </aside>

  <footer id="controls">
    <div class="inner">
      <section id="weather" aria-label="Weather readout">
        <button id="wxbtn" type="button" aria-expanded="false" aria-controls="wxgrid"><span id="wxline">--</span><svg class="sl" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
        <div id="wxgrid" hidden>
          <div class="wx"><span class="k">Temp</span><span class="v" id="wx-temp">--</span></div>
          <div class="wx"><span class="k">Dew pt</span><span class="v" id="wx-dew">--</span></div>
          <div class="wx"><span class="k">Wind</span><span class="v" id="wx-wind">--</span></div>
          <div class="wx"><span class="k">Low cloud</span><span class="v" id="wx-cloud">--</span></div>
          <div class="wx"><span class="k">Sun</span><span class="v" id="wx-sun">--</span></div>
          <div class="note" id="wx-note" hidden>* approx. wind direction</div>
        </div>
      </section>
      <button id="legend" type="button" aria-label="Legend: wetness, 0 dry to 100 icy-fog. Open settings">
        <div class="ramp" id="ramp"></div>
        <div class="ticks"><i style="left:0">0 dry</i><i style="left:20%">20</i><i style="left:50%">50 slick</i><i style="left:100%">100 icy-fog</i></div>
      </button>
      <div id="timebar" class="bar">
        <button id="play" type="button" class="pb" aria-label="Play">
          <span class="ic" aria-hidden="true"></span></button>
        <input id="slider" type="range" min="0" max="96" step="any" value="0" aria-label="Time">
        <div class="clock"><span id="clock">--:--</span><span id="clock-sub"></span></div>
      </div>
    </div>
  </footer>
</div>

<div id="tip" role="status" hidden></div>
<div id="overlay"><div class="box"><div class="spin"></div><div id="status">Loading…</div><button id="retry" type="button" hidden>Retry</button></div></div>

<script type="module" src="app.js"></script>
<script type="module" src="about.js"></script>
</body>
</html>
