<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Death Fog — Task Viewer</title>
<script src="/sidecar.js" onerror="/* standalone mode */"></script>
<style>
  :root {
    --bg: #0f131a;
    --panel: #151b24;
    --panel2: #1b2230;
    --border: #263142;
    --text: #e6edf7;
    --muted: #8b9bb4;
    --accent: #4ea1ff;
    --green: #38c172;
    --amber: #f5b942;
    --red: #ef5350;
    --purple: #a78bfa;
    --cyan: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.45;
  }
  header.app-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    height: 38px;
    padding: 0 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  header.app-hdr h1 { font-size: 13.5px; margin: 0; font-weight: 600; white-space: nowrap; }
  .hdr-right { display: flex; align-items: center; gap: 6px; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    white-space: nowrap;
  }
  .pill.backlog { color: var(--muted); border-color: var(--border); }
  .pill.scope, .pill.brainstorm { color: var(--cyan); border-color: #1f5573; background: #10202b; }
  .pill.plan { color: var(--purple); border-color: #4f3d80; background: #1c172b; }
  .pill.approved, .pill.ready { color: var(--accent); border-color: #264873; background: #122033; }
  .pill.build, .pill.in-progress { color: var(--amber); border-color: #6b5218; background: #261e0f; }
  .pill.review { color: var(--purple); border-color: #4f3d80; background: #1c172b; }
  .pill.beta { color: var(--green); border-color: #1f5c3a; background: #12241b; }
  .pill.main { color: var(--cyan); border-color: #1f5573; background: #10222e; }
  .pill.done, .pill.closed, .pill.ok { color: var(--green); border-color: #1f5c3a; background: #12241b; }
  .pill.warn { color: var(--amber); border-color: #6b5218; background: #261e0f; }
  .pill.info { color: var(--cyan); border-color: #1f5573; }
  .pill.wave {
    padding: 1px 6px;
    font-size: 10px;
    color: var(--accent);
    border-color: #264873;
    background: #132236;
  }

  /* Dismissible Top Toast */
  .toast {
    display: none; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 12px; background: #132236; border-bottom: 1px solid #264873;
    font-size: 12px; color: var(--text); position: sticky; top: 38px; z-index: 28;
  }
  .toast.show { display: flex; }
  .toast.err { background: #2b1418; border-bottom-color: #6b2429; }
  .toast-msg { flex: 1; white-space: pre-wrap; word-break: break-word; max-height: 110px; overflow-y: auto; }
  .toast button.toast-x { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 0 4px; }

  /* Narrow 1-line Task Switcher */
  .switcher-bar {
    display: none; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 12px; background: var(--panel2); border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }

  .app-layout {
    display: grid;
    grid-template-columns: 245px 1fr;
    min-height: calc(100vh - 38px);
    position: relative;
  }
  aside.sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 10px;
    overflow-y: auto;
  }
  @media (max-width: 680px) {
    .switcher-bar { display: flex; }
    .app-layout { grid-template-columns: 1fr; }
    aside.sidebar {
      display: none; position: fixed; top: 72px; left: 0; right: 0; bottom: 0;
      z-index: 25; border-right: none; overflow-y: auto;
    }
    aside.sidebar.open { display: block; }
  }

  /* Collapsible Stage Sections */
  .stage-sec { margin-bottom: 6px; }
  .stage-hdr {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    width: 100%; padding: 5px 6px; border-radius: 6px; border: 1px solid transparent;
    background: transparent; color: var(--muted); cursor: pointer; user-select: none;
    text-align: left; transition: background .12s, color .12s;
  }
  .stage-hdr:hover { background: var(--panel2); color: var(--text); }
  .stage-hdr-left { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .stage-chev {
    width: 11px; font-size: 11px; color: var(--muted);
    display: inline-flex; justify-content: center; flex-shrink: 0;
  }
  .stage-name {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--text);
  }
  .stage-sec.empty .stage-name { color: var(--muted); }
  .stage-sub {
    font-size: 10px; font-weight: 500; color: var(--muted); opacity: .85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stage-count {
    font-size: 10px; font-weight: 700; padding: 0 6px; height: 17px; line-height: 17px;
    border-radius: 999px; background: var(--panel2); border: 1px solid var(--border);
    color: var(--muted); flex-shrink: 0;
  }
  .stage-count.nonzero { color: var(--text); }
  .stage-body { padding: 4px 0 2px 4px; }
  .stage-sec.collapsed .stage-body { display: none; }
  .stage-empty-note {
    font-size: 11px; color: var(--muted); opacity: .6;
    padding: 3px 8px 5px; font-style: italic;
  }
  .task-card {
    padding: 7px 9px; border-radius: 7px; border: 1px solid transparent;
    background: var(--panel2); margin-bottom: 5px; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .task-card:hover { border-color: var(--border); }
  .task-card.active { border-color: var(--accent); background: #19263a; }
  .task-card .r1 { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 600; }
  .task-card .r1-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-card .r2 { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; margin-right: 4px; }

  main { padding: 12px 14px; min-width: 0; overflow-y: auto; }
  .title-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .title-bar h2 { margin: 0; font-size: 15px; font-weight: 600; min-width: 0; }

  /* Forked Lifecycle Sequence */
  .seq {
    display: flex; align-items: center; gap: 0; margin-bottom: 10px;
    padding: 2px 0 10px; border-bottom: 1px solid var(--border); overflow-x: auto;
  }
  .seq-node {
    display: inline-flex; align-items: center; justify-content: center; gap: 3px;
    height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    border: 1px solid var(--border); color: var(--muted); background: transparent;
    white-space: nowrap; text-decoration: none; flex-shrink: 0;
  }
  .seq-node.done { color: var(--green); border-color: #1f5c3a; background: #12241b; }
  .seq-node.current { color: var(--text); border-color: var(--accent); background: #1a2c47; border-width: 1.5px; }
  .seq-node.locked { color: var(--amber); border-color: #8a661a; background: #261e0f; border-width: 1.5px; }
  .seq-node.clickable { cursor: pointer; }
  .seq-node.clickable:hover { border-color: var(--text); }
  .seq-node.fork-pill { min-width: 68px; }
  .seq-line { flex: 1; height: 1.5px; background: var(--border); min-width: 6px; }
  .seq-line.done { background: #266b45; }
  .seq-fork-svg { width: 34px; height: 50px; flex-shrink: 0; display: block; overflow: visible; }
  .seq-fork-arm { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-linecap: round; }
  .seq-fork-arm.done { stroke: #266b45; }
  .seq-fork-stack { display: flex; flex-direction: column; justify-content: space-between; height: 50px; gap: 6px; flex-shrink: 0; }
  .lbl-short { display: none; }
  @media (max-width: 560px) {
    .seq-node { padding: 0 5px; font-size: 10px; }
    .seq-node.fork-pill { min-width: 52px; }
    .lbl-full { display: none; }
    .lbl-short { display: inline; }
  }

  /* Formal Plan Approval Gate Banner */
  .gate-card {
    background: var(--panel); border: 1px solid #6b5218; border-left: 3px solid var(--amber);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
  }
  .gate-card.drift { border-color: #8c2d2d; border-left-color: var(--red); }
  .gate-hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .gate-title { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 700; color: var(--amber); }
  .gate-card.drift .gate-title { color: var(--red); }
  .checklist { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; margin: 6px 0 8px; }
  .chk.ok { color: var(--green); }
  .chk.pending { color: var(--muted); }
  .gate-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  /* Buttons & Dropdown Menus */
  button.btn, a.btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 500;
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  button.btn:hover, a.btn:hover { border-color: var(--accent); }
  button.btn.primary, a.btn.primary { background: #1d4e89; border-color: #2f6db8; }
  button.btn.primary:hover, a.btn.primary:hover { background: #255ea3; }
  button.btn.gate { background: #1b4d3e; border-color: #2e7d5b; }
  button.btn.gate:hover { background: #22634f; }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  button.btn.ghost { background: transparent; padding: 4px 7px; }

  .action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; position: relative; }
  .menu-wrap { position: relative; display: inline-block; }
  .menu-pop {
    display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 35;
    min-width: 215px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.55);
  }
  .menu-pop.right { left: auto; right: 0; }
  .menu-pop.open { display: block; }
  .menu-pop button {
    display: flex; width: 100%; text-align: left; background: transparent; border: none;
    color: var(--text); padding: 6px 9px; border-radius: 5px; font-size: 12px; cursor: pointer;
  }
  .menu-pop button:hover { background: var(--panel2); }

  /* Consolidated Context & Convo Strip */
  .context-strip {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 7px 0; margin-bottom: 8px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; color: var(--muted); }
  .details-panel {
    display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; margin-bottom: 10px; font-size: 11.5px;
  }
  .details-panel.open { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
  .details-panel .k { font-size: 10px; text-transform: uppercase; color: var(--muted); }
  .details-panel .v { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; word-break: break-all; }

  details.convo-history { margin-bottom: 10px; }
  details.convo-history summary { cursor: pointer; font-size: 11.5px; color: var(--muted); user-select: none; }
  .convo-item {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 8px; padding: 6px 8px; margin-top: 6px; border-radius: 6px;
    background: var(--panel2); border: 1px solid var(--border); font-size: 11.5px;
  }
  .link-form { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .link-form input, .link-form select {
    background: #0b0e14; color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 8px; font-size: 11.5px;
  }

  /* Document Workspace & Right-Hand File Browser */
  .doc-workspace {
    display: grid; grid-template-columns: 1fr 210px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); overflow: hidden; position: relative; min-height: 420px;
  }
  .doc-workspace.no-files { grid-template-columns: 1fr; }
  .doc-main { min-width: 0; display: flex; flex-direction: column; }
  .doc-toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
    padding: 7px 11px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .doc-title {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .doc-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: var(--panel2); color: var(--muted); border: none;
    padding: 4px 9px; font-size: 11.5px; cursor: pointer;
  }
  .seg button.active { background: #1d4e89; color: var(--text); font-weight: 600; }
  .doc-pane { padding: 12px 14px; overflow-y: auto; max-height: 62vh; min-width: 0; }

  .file-browser {
    background: var(--panel); border-left: 1px solid var(--border);
    padding: 10px 8px; overflow-y: auto; max-height: calc(62vh + 44px);
  }
  .doc-workspace.no-files .file-browser { display: none; }
  @media (max-width: 760px) {
    .doc-workspace { grid-template-columns: 1fr; }
    .file-browser {
      display: none; position: absolute; top: 0; right: 0; bottom: 0; width: 220px;
      max-height: none; z-index: 20; box-shadow: -8px 0 24px rgba(0,0,0,.55);
    }
    .file-browser.open { display: block; }
  }
  .fb-grp {
    font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); font-weight: 700; margin: 9px 6px 4px;
  }
  .fb-grp:first-child { margin-top: 2px; }
  .fb-item {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--muted);
    border: 1px solid transparent;
  }
  .fb-item:hover { background: var(--panel2); color: var(--text); }
  .fb-item.active { background: #19263a; color: var(--text); font-weight: 600; border-color: #2b456b; }
  .fb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fb-sz { font-size: 10px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; opacity: .7; flex-shrink: 0; }

  /* Rendered Markdown Typography */
  .md-body { font-size: 13px; line-height: 1.55; color: var(--text); word-break: break-word; }
  .md-body h1 { font-size: 17px; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .md-body h2 { font-size: 14.5px; margin: 15px 0 6px; color: var(--cyan); }
  .md-body h3 { font-size: 13px; margin: 12px 0 4px; color: var(--text); }
  .md-body h4 { font-size: 12.5px; margin: 10px 0 4px; color: var(--muted); }
  .md-body p { margin: 6px 0; }
  .md-body ul, .md-body ol { padding-left: 18px; margin: 6px 0; }
  .md-body li { margin: 3px 0; }
  .md-body li.md-chk { list-style: none; margin-left: -14px; }
  .md-body li.md-chk-done { color: var(--green); }
  .md-body code {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 4px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px;
  }
  .md-body pre {
    background: #0b0e14; border: 1px solid var(--border); border-radius: 7px;
    padding: 10px; overflow-x: auto; font-size: 11.5px; margin: 8px 0;
  }
  .md-body pre code { background: none; border: none; padding: 0; }
  .md-body blockquote {
    margin: 8px 0; padding: 6px 10px; border-left: 3px solid var(--accent);
    background: var(--panel); color: var(--muted); border-radius: 0 6px 6px 0;
  }
  .md-body table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; display: block; overflow-x: auto; }
  .md-body th, .md-body td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
  .md-body th { background: var(--panel); color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .md-body a { color: var(--accent); text-decoration: none; }
  .md-body a:hover { text-decoration: underline; }
  .md-body hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  pre.doc {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; color: #d5e0f0;
  }
  textarea.editor {
    width: 100%; min-height: 340px; max-height: 60vh;
    background: #0b0e14; color: var(--text); border: 1px solid var(--accent);
    border-radius: 8px; padding: 11px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px;
    resize: vertical;
  }
  .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
  .shots img { width: 100%; border-radius: 8px; border: 1px solid var(--border); }
  iframe.mockup { width: 100%; height: 480px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
  .empty { color: var(--muted); padding: 18px; text-align: center; background: var(--panel); border: 1px dashed var(--border); border-radius: 8px; }

  /* Zero-Token Inline Convo Preview Modal */
  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(5,8,13,.75);
    z-index: 60; align-items: center; justify-content: center; padding: 14px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    width: 100%; max-width: 580px; max-height: 84vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    box-shadow: 0 18px 48px rgba(0,0,0,.6);
  }
  .modal-hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .turn { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; margin-bottom: 6px; font-size: 12px; }
  .artifact-box { background: #0b0e14; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }

  /* Token Usage Breakdown Card */
  .usage-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .usage-card-hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .usage-tbl { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 11.5px; }
  .usage-tbl th, .usage-tbl td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  .usage-tbl th { font-size: 10.5px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .usage-tbl td.num, .usage-tbl th.num { text-align: right; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .usage-tbl tbody tr.usage-total td { border-bottom: none; font-weight: 600; color: var(--cyan); }
</style>
</head>
<body>
<header class="app-hdr">
  <h1>Death Fog Tasks</h1>
  <div class="hdr-right">
    <span id="parity-badge"></span>
    <span class="pill" id="sync-status">Loading...</span>
    <button class="btn ghost" onclick="refresh(true)" title="Refresh now">↻</button>
  </div>
</header>

<div class="toast" id="toast">
  <span class="toast-msg" id="toast-msg"></span>
  <span id="toast-actions" style="display:inline-flex;align-items:center;gap:6px;flex-shrink:0;"></span>
  <button class="toast-x" onclick="hideToast()" title="Dismiss">×</button>
</div>

<div class="switcher-bar" id="switcher-bar" onclick="toggleDrawer()">
  <div id="switcher-label"><span style="color:var(--muted);">▾</span> Select task</div>
  <span class="mono" id="switcher-count"></span>
</div>

<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="detail"><div class="empty">Select a task to inspect its stage gate, plan, mockups, and evidence.</div></main>
</div>

<!-- Zero-Token Inline Convo Preview Modal -->
<div class="modal-bg" id="convo-modal" onclick="if(event.target===this) closeConvoModal()">
  <div class="modal" id="convo-modal-body"></div>
</div>

<script>
const STATUS_ALIASES = {
  brainstorm: 'scope',
  ready: 'approved',
  'in-progress': 'build',
  closed: 'done',
};

function normalizeStatus(s) {
  const k = String(s || '').trim().toLowerCase();
  return STATUS_ALIASES[k] || k;
}

const STAGE_LABELS = {
  backlog: 'Backlog',
  scope: 'Scope',
  brainstorm: 'Scope',
  plan: 'Plan',
  approved: 'Approved',
  ready: 'Approved',
  build: 'Build',
  'in-progress': 'Build',
  review: 'Review',
  beta: 'Beta',
  main: 'Main',
  done: 'Done',
  closed: 'Done',
};

const STAGE_STORAGE_KEY = 'df_viewer_stage_collapsed_v1';
const STAGE_SECTIONS = [
  { key: 'build',    label: 'Build',    sub: '',            defaultCollapsed: false },
  { key: 'review',   label: 'Review',   sub: '',            defaultCollapsed: false },
  { key: 'approved', label: 'Approved', sub: '',            defaultCollapsed: false },
  { key: 'plan',     label: 'Plan',     sub: '',            defaultCollapsed: false },
  { key: 'scope',    label: 'Scope',    sub: '',            defaultCollapsed: false },
  { key: 'backlog',  label: 'Backlog',  sub: '',            defaultCollapsed: false },
  { key: 'beta',     label: 'Beta',     sub: 'v3-dev only', defaultCollapsed: false },
  { key: 'main',     label: 'Main',     sub: 'main only',   defaultCollapsed: false },
  { key: 'done',     label: 'Done',     sub: 'both',        defaultCollapsed: true  },
];

function loadCollapsed() {
  const defaults = {};
  STAGE_SECTIONS.forEach(s => { defaults[s.key] = s.defaultCollapsed; });
  try {
    const raw = localStorage.getItem(STAGE_STORAGE_KEY);
    if (!raw) return defaults;
    return { ...defaults, ...JSON.parse(raw) };
  } catch (_) {
    return defaults;
  }
}

function saveCollapsed(state) {
  try {
    localStorage.setItem(STAGE_STORAGE_KEY, JSON.stringify(state));
  } catch (_) {}
}

let COLLAPSED = loadCollapsed();

function toggleSection(key) {
  COLLAPSED[key] = !COLLAPSED[key];
  saveCollapsed(COLLAPSED);
  renderSidebar();
}

let STATE = null;
let LAST_STATE_JSON = '';
let SELECTED = null;
let ACTIVE_FILE = 'PLAN.md';
let MD_MODE = 'rendered'; // 'rendered' | 'raw'
let FILES_OPEN = window.innerWidth > 760;
let FILE_CACHE = {}; // `${taskId}:${path}` -> { content, loading, error, binary }
let LAST_ACTIVE_WT = null;
let EDITING = null; // 'plan' | 'handoff' | null
let REVIEWED_CHK = false;
let DETAILS_OPEN = false;
let CONVO_HIST_OPEN = false;
let MODAL_OPEN = false;
let MOCKUP_IFRAME_NODE = null;
let MOCKUP_IFRAME_SRC = '';

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getSidecarBridge() {
  if (window.sidecar) return window.sidecar;
  try {
    if (window.parent && window.parent !== window && window.parent.sidecar) return window.parent.sidecar;
  } catch (_) {}
  return null;
}

function hasSidecarChat() {
  const sc = getSidecarBridge();
  return Boolean(sc && sc.agent && typeof sc.agent.sendMessage === 'function');
}

function showToast(msg, isErr = false, actionsHtml = '') {
  const el = document.getElementById('toast');
  const m = document.getElementById('toast-msg');
  const act = document.getElementById('toast-actions');
  if (!el || !m) return;
  m.textContent = msg;
  if (act) act.innerHTML = actionsHtml || '';
  el.classList.toggle('err', Boolean(isErr));
  el.classList.add('show');
}

function hideToast() {
  document.getElementById('toast')?.classList.remove('show');
}

function toggleDrawer(force) {
  const sb = document.getElementById('sidebar');
  if (!sb) return;
  sb.classList.toggle('open', force !== undefined ? force : !sb.classList.contains('open'));
}

function toggleMenu(id, ev) {
  if (ev) ev.stopPropagation();
  document.querySelectorAll('.menu-pop').forEach(m => { if (m.id !== id) m.classList.remove('open'); });
  document.getElementById(id)?.classList.toggle('open');
}

document.addEventListener('click', (ev) => {
  if (!ev.target.closest('.menu-wrap')) {
    document.querySelectorAll('.menu-pop.open').forEach(m => m.classList.remove('open'));
  }
});

function renderParityBadge() {
  const el = document.getElementById('parity-badge');
  if (!el || !STATE || !STATE.main_parity) return;
  const mp = STATE.main_parity;
  if (!mp.ok) { el.innerHTML = ''; return; }
  if (mp.in_sync) {
    el.innerHTML = '<span class="pill ok" title="Shared agent/tooling files match origin/main">main↔beta ✓</span>';
  } else {
    const list = (mp.drifted || []).join(', ');
    el.innerHTML = `<span class="pill warn" title="Drifted shared files: ${esc(list)}">main drift (${mp.drifted.length})</span> <button class="btn gate" style="padding:2px 7px;font-size:11px;" onclick="runSyncMain()">Sync → main</button>`;
  }
}

async function runSyncMain() {
  showToast('Syncing shared agent/tooling files from v3-dev to origin/main (with isolated tests)...');
  try {
    const res = await postAction({ action: 'sync_main', push: true });
    showToast((res.ok ? 'OK: ' : 'FAILED: ') + (res.message || res.error || JSON.stringify(res)), !res.ok);
    await refresh(true);
  } catch (e) {
    showToast('Error: ' + e.message, true);
  }
}

async function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) {}
  document.body.removeChild(ta);
  return ok;
}

async function copyWithBtnFeedback(btn, text, label = 'Copied ✓') {
  const ok = await copyText(text);
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = ok ? label : 'Copy failed';
    setTimeout(() => { btn.textContent = orig; }, 1400);
  }
  if (!ok) showToast('Clipboard unavailable — value: ' + text, true);
}

async function postAction(payload) {
  const r = await fetch('/api/action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const raw = await r.text();
  let parsed = null;
  try {
    parsed = raw ? JSON.parse(raw) : {};
  } catch (_) {
    return {
      ok: false,
      status: r.status,
      error: `HTTP ${r.status}: ${(raw || 'Invalid non-JSON response').slice(0, 300)}`,
    };
  }
  if (!r.ok && parsed && typeof parsed === 'object' && parsed.ok === undefined) {
    return { ok: false, status: r.status, error: parsed.error || `HTTP ${r.status}`, ...parsed };
  }
  return parsed || { ok: r.ok };
}

function isUserInteracting() {
  if (EDITING || MODAL_OPEN || REVIEWED_CHK) return true;
  if (document.querySelector('.menu-pop.open')) return true;
  const active = document.activeElement;
  if (active && ['INPUT', 'TEXTAREA', 'SELECT'].includes(active.tagName)) return true;
  return false;
}

let LAST_ERROR_MSG = '';

async function refresh(manual = false) {
  if (!manual && isUserInteracting()) return;
  const statusEl = document.getElementById('sync-status');
  if (manual) {
    if (statusEl) statusEl.textContent = 'Refreshing…';
    FILE_CACHE = {};
    LAST_STATE_JSON = '';
  }
  try {
    const url = manual ? '/api/state?refresh=1' : '/api/state';
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) {
      const err = new Error(`HTTP ${r.status}`);
      err.isBackendError = true;
      throw err;
    }
    const rawText = await r.text();
    if (!manual && rawText === LAST_STATE_JSON) {
      return;
    }
    const parsed = JSON.parse(rawText);
    if (parsed && parsed.error) {
      const err = new Error(String(parsed.error));
      err.isBackendError = true;
      throw err;
    }
    LAST_STATE_JSON = rawText;
    STATE = parsed;
    LAST_ERROR_MSG = '';

    if (!SELECTED || (STATE.active_task_id && STATE.active_task_id !== LAST_ACTIVE_WT && STATE.tasks[STATE.active_task_id]?.active_worktree)) {
      SELECTED = STATE.active_task_id;
      LAST_ACTIVE_WT = STATE.active_task_id;
    }
    if (SELECTED && !STATE.tasks[SELECTED]) SELECTED = STATE.active_task_id;
    const modeTag = hasSidecarChat() ? 'ag' : 'live';
    const count = Object.keys(STATE.tasks).length;
    if (statusEl) statusEl.textContent = `${count} · ${modeTag}`;
    renderParityBadge();
    renderSwitcher();
    renderSidebar();
    renderDetail();
    if (manual && SELECTED && ACTIVE_FILE && !['PLAN.md', 'TASK.md', 'HANDOFF.md'].includes(ACTIVE_FILE) && !/\.(html?|png|jpe?g|webp|gif|svg)$/i.test(ACTIVE_FILE)) {
      if (!FILE_CACHE[`${SELECTED}:${ACTIVE_FILE}`]?.loading) {
        fetchTaskFile(SELECTED, ACTIVE_FILE);
      }
    }
  } catch (e) {
    const msg = String(e?.message || e || 'Unknown error');
    const isBackendErr = Boolean(e && (e.isBackendError || e instanceof SyntaxError));
    if (statusEl) {
      statusEl.textContent = isBackendErr ? 'Error' : 'Offline';
    }
    if (manual || msg !== LAST_ERROR_MSG) {
      LAST_ERROR_MSG = msg;
      showToast((isBackendErr ? 'Task Viewer error: ' : 'Offline: ') + msg, true);
    }
    if (manual) console.error(e);
  }
}

function renderSwitcher() {
  const lbl = document.getElementById('switcher-label');
  const cnt = document.getElementById('switcher-count');
  if (!lbl || !STATE) return;
  const total = Object.keys(STATE.tasks || {}).length;
  if (cnt) cnt.textContent = `${total} tasks`;
  const t = SELECTED ? STATE.tasks[SELECTED] : null;
  if (!t) {
    lbl.innerHTML = '<span style="color:var(--muted);">▾</span> Select task';
    return;
  }
  const st = normalizeStatus(t.status);
  const stLbl = STAGE_LABELS[st] || t.status;
  lbl.innerHTML = `<span style="color:var(--muted);margin-right:4px;">▾</span><strong>#${esc(t.id)}</strong> · ${esc(t.slug)} <span class="pill ${esc(st)}" style="margin-left:4px;">${esc(stLbl)}</span>`;
}

function taskBucketFor(t) {
  const ms = t.merge_status || {};
  const b = normalizeStatus(t.stage_bucket || ms.stage_bucket || t.status);
  return STAGE_SECTIONS.some(s => s.key === b) ? b : 'backlog';
}

function renderSidebar() {
  const el = document.getElementById('sidebar');
  if (!STATE || !Object.keys(STATE.tasks).length) {
    el.innerHTML = '<div class="empty">No tasks in tasks/</div>';
    return;
  }
  const grouped = {};
  STAGE_SECTIONS.forEach(s => { grouped[s.key] = []; });
  Object.values(STATE.tasks).forEach(t => {
    grouped[taskBucketFor(t)].push(t);
  });
  Object.values(grouped).forEach(arr => {
    arr.sort((a, b) => ((a.wave || 999) - (b.wave || 999)) || String(a.id).localeCompare(String(b.id)));
  });

  el.innerHTML = STAGE_SECTIONS.map(sec => {
    const items = grouped[sec.key] || [];
    const isCollapsed = Boolean(COLLAPSED[sec.key]);
    const chev = isCollapsed ? '▸' : '▾';
    const secCls = `stage-sec${isCollapsed ? ' collapsed' : ''}${items.length === 0 ? ' empty' : ''}`;
    const subHtml = sec.sub ? `<span class="stage-sub">${esc(sec.sub)}</span>` : '';
    const countCls = `stage-count${items.length > 0 ? ' nonzero' : ''}`;
    const bodyHtml = items.length
      ? items.map(t => cardHtml(t)).join('')
      : '<div class="stage-empty-note">0 tasks</div>';

    return `<div class="${secCls}">
      <button type="button" class="stage-hdr" onclick="toggleSection('${esc(sec.key)}')">
        <span class="stage-hdr-left">
          <span class="stage-chev">${chev}</span>
          <span class="stage-name">${esc(sec.label)}</span>
          ${subHtml}
        </span>
        <span class="${countCls}">${items.length}</span>
      </button>
      <div class="stage-body">${bodyHtml}</div>
    </div>`;
  }).join('');
}

function cardHtml(t) {
  if (!t) return '';
  const active = t.id === SELECTED ? ' active' : '';
  const ms = t.merge_status || {};
  const st = normalizeStatus(t.status);
  const bucket = taskBucketFor(t);

  let badge = '';
  if (bucket === 'approved' && t.wave) badge = `<span class="pill wave">W${esc(t.wave)}</span>`;
  else if (t.active_worktree) badge = '<span class="pill build">WT</span>';
  else if (bucket === 'review' && ms.pr) badge = `<span class="pill review">PR #${esc(ms.pr)}</span>`;
  else if (bucket === 'beta') badge = '<span class="pill beta">Beta</span>';
  else if (bucket === 'main') badge = '<span class="pill main">Main</span>';
  else if (bucket === 'done') badge = '<span class="pill done">Done</span>';

  let dotColor = 'var(--muted)';
  if (ms.in_beta) dotColor = 'var(--green)';
  else if (ms.in_public) dotColor = 'var(--cyan)';
  else if (t.active_worktree || st === 'build') dotColor = 'var(--amber)';
  else if (st === 'review' || st === 'plan') dotColor = 'var(--purple)';
  else if (st === 'approved') dotColor = 'var(--accent)';
  else if (st === 'scope') dotColor = 'var(--cyan)';

  return `<div class="task-card${active}" onclick="selectTask('${esc(t.id)}')">
    <div class="r1">
      <span class="r1-title"><span class="dot" style="background:${dotColor}"></span>#${esc(t.id)} ${esc(t.slug)}</span>
      ${badge}
    </div>
    <div class="r2">${esc((t.owned_paths || []).join(', ') || 'no owned_paths')}</div>
  </div>`;
}

  SELECTED = id;
  ACTIVE_FILE = 'PLAN.md';
  EDITING = null;
  REVIEWED_CHK = false;
  CONVO_HIST_OPEN = false;
  toggleDrawer(false);
  renderSwitcher();

  ACTIVE_FILE = path;
  EDITING = null;
  if (window.innerWidth <= 760) FILES_OPEN = false;
  const t = STATE && SELECTED ? STATE.tasks[SELECTED] : null;
  if (t && !['PLAN.md', 'TASK.md', 'HANDOFF.md'].includes(path) && !/\.(html?|png|jpe?g|webp|gif|svg)$/i.test(path)) {
    const key = `${t.id}:${path}`;

      fetchTaskFile(t.id, path);

/** Fetch a task file via the safe `read_task_file` action and cache it. */
async function fetchTaskFile(taskId, path) {
  const key = `${taskId}:${path}`;
  FILE_CACHE[key] = { loading: true };
  try {
    const res = await postAction({ action: 'read_task_file', task_id: taskId, path });
    if (res.ok) {
      FILE_CACHE[key] = { content: res.content ?? '', binary: Boolean(res.binary), truncated: Boolean(res.truncated) };
    } else {
      FILE_CACHE[key] = { error: res.error || 'Could not read file.' };
    }
  } catch (e) {
    FILE_CACHE[key] = { error: e.message };
  }
  if (SELECTED === taskId && ACTIVE_FILE === path) {
    renderDetail();
  }
}

/** Format byte size into a compact human-readable string. */
function formatBytes(bytes) {
  const n = Number(bytes) || 0;
  if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}

/** Render Markdown string to sanitized HTML without external dependencies. */
function renderMarkdown(md) {
  const codeBlocks = [];
  const inlineCodes = [];
  let text = String(md ?? '').replace(/\r\n/g, '\n');

  text = text.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const idx = codeBlocks.length;
    codeBlocks.push(`<pre><code${lang ? ` class="lang-${esc(lang)}"` : ''}>${esc(code.replace(/\n$/, ''))}</code></pre>`);
    return `\x00CB${idx}\x00`;
  });

  text = esc(text);

  text = text.replace(/`([^`\n]+)`/g, (_, code) => {
    const idx = inlineCodes.length;
    inlineCodes.push(`<code>${code}</code>`);
    return `\x00IC${idx}\x00`;
  });

  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) =>
    `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`
  );

  text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');

  const lines = text.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    const cbMatch = line.trim().match(/^\x00CB(\d+)\x00$/);
    if (cbMatch) {
      out.push(codeBlocks[Number(cbMatch[1])]);
      i++;
      continue;
    }

    if (/^(\s*[-*_]){3,}\s*$/.test(line)) {
      out.push('<hr />');
      i++;
      continue;
    }

    const hMatch = line.match(/^(#{1,4})\s+(.+)$/);
    if (hMatch) {
      const lvl = hMatch[1].length;
      out.push(`<h${lvl}>${hMatch[2]}</h${lvl}>`);
      i++;
      continue;
    }

    if (/^&gt;\s?/.test(line)) {
      const bq = [];
      while (i < lines.length && /^&gt;\s?/.test(lines[i])) {
        bq.push(lines[i].replace(/^&gt;\s?/, ''));
        i++;
      }
      out.push(`<blockquote>${bq.join('<br />')}</blockquote>`);
      continue;
    }

    if (line.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      const parseRow = (r) => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const headers = parseRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') {
        rows.push(parseRow(lines[i]));
        i++;
      }
      const thead = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>`;
      const tbody = `<tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>`;
      out.push(`<table>${thead}${tbody}</table>`);
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        const item = lines[i].replace(/^\s*[-*]\s+/, '');
        if (/^\[[xX]\]\s+/.test(item)) {
          items.push(`<li class="md-chk md-chk-done">☑ ${item.slice(4)}</li>`);
        } else if (/^\[ \]\s+/.test(item)) {
          items.push(`<li class="md-chk">☐ ${item.slice(4)}</li>`);
        } else {
          items.push(`<li>${item}</li>`);
        }
        i++;
      }
      out.push(`<ul>${items.join('')}</ul>`);
      continue;
    }

    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(`<li>${lines[i].replace(/^\s*\d+\.\s+/, '')}</li>`);
        i++;
      }
      out.push(`<ol>${items.join('')}</ol>`);
      continue;
    }

    const para = [];
    while (
      i < lines.length &&
      lines[i].trim() !== '' &&
      !/^(#{1,4}\s+|&gt;\s?|\s*[-*]\s+|\s*\d+\.\s+|\x00CB\d+\x00)/.test(lines[i])
    ) {
      para.push(lines[i]);
      i++;
    }
    out.push(`<p>${para.join('<br />')}</p>`);
  }

  let html = out.join('\n');
  html = html.replace(/\x00CB(\d+)\x00/g, (_, idx) => codeBlocks[Number(idx)]);
  html = html.replace(/\x00IC(\d+)\x00/g, (_, idx) => inlineCodes[Number(idx)]);
  return `<div class="md-body">${html}</div>`;
}

function startEdit(kind) {
  EDITING = kind;
  renderDetail();
}

function cancelEdit() {
  EDITING = null;
  renderDetail();
}

async function saveDoc(kind) {
  const ta = document.getElementById('doc-editor');
  if (!ta || !SELECTED) return;
  const action = kind === 'plan' ? 'save_plan' : 'save_handoff';
  showToast(`Saving ${kind.toUpperCase()}.md...`);
  try {
    const res = await postAction({ action, task_id: SELECTED, content: ta.value });
    EDITING = null;
    showToast((res.ok ? 'OK: ' : 'FAILED: ') + (res.message || res.error || JSON.stringify(res)), !res.ok);
    await refresh(true);
  } catch (e) {
    showToast('Error: ' + e.message, true);
  }
}

let ACTION_IN_FLIGHT = false;
let LAST_CHAT_MSG = '';

/// Copy the most recent gate/ambiguity chat trigger message to clipboard.
async function copyLastChatMsg() {
  if (!LAST_CHAT_MSG) return;
  const ok = await copyText(LAST_CHAT_MSG);
  showToast(ok ? 'Copied chat message to clipboard.' : 'Clipboard unavailable — ' + LAST_CHAT_MSG, !ok);
}

/// Send or copy an ambiguity-resolution prompt for the selected task's open questions.
async function resolveAmbiguitiesInChat() {
  const t = STATE && SELECTED ? STATE.tasks[SELECTED] : null;
  if (!t) return;
  const rd = t.plan_readiness || {};
  const qs = Array.isArray(rd.open_questions) ? rd.open_questions : [];
  const items = qs.length ? qs.slice(0, 4).join('; ') : 'Open Questions in PLAN.md';
  const msg = `[Task ${t.id}] Resolve ambiguities in PLAN.md before advancing gate: ${items}. Ask clarifying questions and set Open Questions: None once settled.`;
  LAST_CHAT_MSG = msg;
  if (hasSidecarChat()) {
    try {
      await getSidecarBridge().agent.sendMessage(msg);
      showToast('Sent ambiguity resolution prompt to active chat.');
      return;
    } catch (_) {}
  }
  const ok = await copyText(msg);
  showToast(ok ? 'Copied ambiguity prompt for chat.' : msg, !ok);
}

async function runAction(action, extra = {}) {
  if (!SELECTED) return;
  if (ACTION_IN_FLIGHT) {
    showToast(`Action '${ACTION_IN_FLIGHT}' is already running — please wait...`);
    return;
  }
  ACTION_IN_FLIGHT = action;
  showToast(`Running '${action}' for task ${SELECTED}...`);
  try {
    let res = await postAction({ action, task_id: SELECTED, ...extra });
    if (!res.ok && res.needs_confirm && !extra.force) {
      const msg = res.error || 'Confirm landing unpromoted switch to Main?';
      if (typeof window.confirm === 'function' && window.confirm(msg)) {
        showToast(`Confirming '${action}' for task ${SELECTED}...`);
        res = await postAction({ action, task_id: SELECTED, ...extra, force: true });
      } else {
        showToast('Cancelled: ' + msg, true);
        return;
      }
    }
    if (res.ok && action === 'approve_plan') {
      REVIEWED_CHK = false;
    }
    if (res.ok && action === 'start') {
      const ctaBtn = hasSidecarChat()
        ? `<button class="btn primary" style="padding:3px 8px;font-size:11.5px;" onclick="sendWorkerBriefToChat()">Send Worker Brief to Active Chat</button>`
        : `<button class="btn primary" style="padding:3px 8px;font-size:11.5px;" onclick="copyResumePrompt(true)">Copy Worker Brief</button>`;
      showToast('Worktree ready — send brief to agent to begin implementation', false, ctaBtn);
    } else if (res.chat_message && (action === 'approve_gate' || action === 'approve_plan' || res.blocked_by_ambiguities)) {
      LAST_CHAT_MSG = res.chat_message;
      let sentToChat = false;
      if (hasSidecarChat()) {
        try {
          await getSidecarBridge().agent.sendMessage(res.chat_message);
          sentToChat = true;
        } catch (_) {
          sentToChat = false;
        }
      }
      const copyBtn = `<button class="btn primary" style="padding:3px 8px;font-size:11.5px;" onclick="copyLastChatMsg()">Copy for Chat</button>`;
      const baseMsg = res.ok
        ? (res.message || 'Gate updated')
        : ('BLOCKED: ' + (res.error || 'Gate blocked'));
      if (sentToChat) {
        showToast(`${baseMsg} — sent update to active chat`, !res.ok);
      } else {
        showToast(baseMsg, !res.ok, copyBtn);
      }
    } else {
      showToast((res.ok ? 'OK: ' : 'FAILED: ') + (res.message || res.output || res.error || JSON.stringify(res)), !res.ok);
    }
    await refresh(true);
  } catch (e) {
    showToast('Error: ' + e.message, true);
  } finally {
    ACTION_IN_FLIGHT = false;
  }
}

function renderSequence(t) {
  const ms = t.merge_status || {};
  const st = normalizeStatus(t.status);
  const bucket = taskBucketFor(t);
  const preOrder = ['scope', 'plan', 'approved', 'build', 'review'];
  const inBranches = Boolean(ms.in_beta || ms.in_public || bucket === 'beta' || bucket === 'main' || bucket === 'done');
  const preIdx = inBranches ? preOrder.length : (st === 'backlog' ? -1 : Math.max(0, preOrder.indexOf(st)));

  const preNodes = [
    { key: 'scope',    full: 'Scope',    short: 'Scope', icon: '' },
    { key: 'plan',     full: 'Plan',     short: 'Plan',  icon: st === 'plan' || (st === 'approved' && t.plan_drifted) ? '🔒' : '' },
    { key: 'approved', full: 'Approved', short: 'Appr',  icon: '' },
    { key: 'build',    full: 'Build',    short: 'Build', icon: t.active_worktree ? '●' : '' },
    { key: 'review',   full: ms.pr ? `PR #${ms.pr}` : 'Review', short: ms.pr ? `#${ms.pr}` : 'PR', icon: '', href: ms.pr_url || '' },
  ];

  const preHtml = preNodes.map((n, i) => {
    const isDone = i < preIdx;
    const isCur = !inBranches && i === preIdx;
    const cls = isDone ? 'done' : (isCur ? (n.key === 'plan' ? 'locked' : 'current') : '');
    const prefix = isDone ? '✓ ' : (n.icon ? n.icon + ' ' : '');
    const titleAttr = esc(n.full);
    let nodeHtml = '';
    if (n.href) {
      nodeHtml = `<a class="seq-node ${cls} clickable" href="${esc(n.href)}" target="_blank" title="${titleAttr}">${prefix}<span class="lbl-full">${esc(n.full)}</span><span class="lbl-short">${esc(n.short)}</span> ↗</a>`;
    } else {
      nodeHtml = `<span class="seq-node ${cls}" title="${titleAttr}">${prefix}<span class="lbl-full">${esc(n.full)}</span><span class="lbl-short">${esc(n.short)}</span></span>`;
    }
    const lineHtml = i < preNodes.length - 1 ? `<span class="seq-line ${i < preIdx ? 'done' : ''}"></span>` : '';
    return nodeHtml + lineHtml;
  }).join('');

  const betaLit = Boolean(ms.in_beta || bucket === 'beta' || bucket === 'done');
  const mainLit = Boolean(ms.in_public || bucket === 'main' || bucket === 'done');
  const bothLit = betaLit && mainLit;

  const splitTop = `<path class="seq-fork-arm${betaLit ? ' done' : ''}" d="M 0 25 C 16 25, 16 11, 34 11" />`;
  const splitBot = `<path class="seq-fork-arm${mainLit ? ' done' : ''}" d="M 0 25 C 16 25, 16 39, 34 39" />`;
  const splitPaths = [
    !betaLit ? splitTop : '',
    !mainLit ? splitBot : '',
    betaLit ? splitTop : '',
    mainLit ? splitBot : '',
  ].join('');

  const mergeTop = `<path class="seq-fork-arm${bothLit ? ' done' : ''}" d="M 0 11 C 18 11, 18 25, 34 25" />`;
  const mergeBot = `<path class="seq-fork-arm${bothLit ? ' done' : ''}" d="M 0 39 C 18 39, 18 25, 34 25" />`;

  const betaNode = `<span class="seq-node fork-pill clickable ${betaLit ? 'done' : ''}" onclick="runAction('open_beta')" title="Open Beta (v3-dev) Preview">${betaLit ? '✓ ' : ''}Beta</span>`;
  const mainTitle = ms.merged_sha ? `Main (${ms.merged_sha})` : 'Main (public)';
  const mainNode = `<span class="seq-node fork-pill ${mainLit ? 'done' : ''}" title="${esc(mainTitle)}">${mainLit ? '✓ ' : ''}Main</span>`;
  const doneNode = `<span class="seq-node ${bothLit ? 'done' : ''}" title="Converged in both v3-dev and main">${bothLit ? '✓ ' : ''}Done</span>`;

  return `<div class="seq">
    ${preHtml}
    <svg class="seq-fork-svg" viewBox="0 0 34 50" aria-hidden="true">${splitPaths}</svg>
    <div class="seq-fork-stack">
      ${betaNode}
      ${mainNode}
    </div>
    <svg class="seq-fork-svg" viewBox="0 0 34 50" aria-hidden="true">${mergeTop}${mergeBot}</svg>
    ${doneNode}
  </div>`;
}

function renderGateCallout(t) {

  if (st === 'plan' || (st === 'approved' && drifted)) {

    return `<div class="gate-card ${drifted ? 'drift' : ''}">
      <div class="gate-hdr">
        <span class="gate-title">${drifted ? '⚠ Plan Drifted Since Approval' : '🔒 Formal Plan Approval Gate'}</span>
        <span class="pill warn">Build Locked</span>
      </div>
      <div class="checklist">${chkHtml}</div>
      ${ambigHtml}
      <div class="gate-foot">
        <label style="font-size:11.5px;display:flex;align-items:center;gap:5px;cursor:pointer;">
          <input type="checkbox" ${REVIEWED_CHK ? 'checked' : ''} onchange="REVIEWED_CHK=this.checked;renderDetail()" />

        </label>
        <button class="btn gate" ${canApprove ? '' : 'disabled'} onclick="runAction('approve_plan')" title="${rd.ready ? 'Approve PLAN.md and unlock worktree build' : 'Complete PLAN.md spec, owned_paths, and resolve ambiguities first'}">✓ Approve Plan &amp; Unlock Build</button>
      </div>

  }

  if (drifted) {
    return `<div class="gate-card drift" style="padding:7px 10px;">
      <div class="gate-hdr" style="margin-bottom:0;">
        <span class="gate-title">⚠ PLAN.md drifted since approval (${esc(t.plan_approved_sha || '')} → ${esc(rd.plan_sha || '')})</span>
        <button class="btn" style="padding:3px 8px;font-size:11px;" onclick="runAction('approve_plan')">Re-approve SHA</button>
      </div>
    </div>`;
  }
  return '';
}

function getPersistentMockupIframe(src) {
  if (!MOCKUP_IFRAME_NODE || MOCKUP_IFRAME_SRC !== src) {

    ifr.className = 'mockup';
    ifr.src = src;
    MOCKUP_IFRAME_NODE = ifr;

function formatTok(n) {
  const num = Number(n) || 0;
  if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
  return String(num);
}

function buildUsageTooltip(usage) {
  const byModel = usage && usage.by_model;
  if (!byModel || typeof byModel !== 'object') return '';
  return Object.entries(byModel)
    .map(([m, s]) => `${m}: ${formatTok(s.input_tokens)} in / ${formatTok(s.cache_read_tokens)} cache / ${formatTok(s.output_tokens)} out`)
    .join(' · ');
}

function renderDetail() {
  const el = document.getElementById('detail');
  const t = STATE && SELECTED ? STATE.tasks[SELECTED] : null;
  if (!t) {
    el.innerHTML = '<div class="empty">Select a task to inspect.</div>';
    return;
  }

  const ms = t.merge_status || {};
  const st = normalizeStatus(t.status);
  const hasClaude = Boolean(STATE?.available_launchers?.claude);

  let primaryBtn = '';
  if (st === 'approved' && !t.plan_drifted) {
    primaryBtn = `<button class="btn primary" onclick="runAction('start')">▶ Start Worktree</button>`;
  } else if (st === 'build') {
    primaryBtn = `<button class="btn primary" onclick="runAction('verify')">✓ Run Verify</button>`;
  } else if (st === 'review') {
    primaryBtn = ms.pr_url
      ? `<a class="btn primary" href="${esc(ms.pr_url)}" target="_blank">Open PR #${esc(ms.pr)} ↗</a> <button class="btn" onclick="runAction('verify')">✓ Run Verify</button>`
      : `<button class="btn primary" onclick="runAction('verify')">✓ Run Verify</button>`;
  } else if (st === 'beta' || st === 'main' || st === 'done') {
    primaryBtn = `<button class="btn primary" onclick="runAction('open_beta')">Beta Preview ↗</button>`;
  }

  const extraBetaBtn = st === 'build'
    ? `<button class="btn" onclick="runAction('open_beta')">Beta Preview ↗</button>`
    : '';

  const verifyOk = Boolean(t.verify && t.verify.ok);
  const headSha = String(t.git_summary?.head_sha || '').trim();
  const verifySha = String(t.verify?.git_sha || '').trim();
  const shaMatches = !headSha || Boolean(verifySha && (verifySha.startsWith(headSha) || headSha.startsWith(verifySha)));
  const canLandBeta = verifyOk && shaMatches;
  const landBetaTip = !verifyOk
    ? 'Run Verify first before landing on Beta'
    : (!shaMatches
        ? `Verify SHA (${verifySha.slice(0, 8)}) != HEAD (${headSha}) — re-run Verify`
        : 'Merge into v3-dev, remove worktree, and deploy Beta');
  const landBetaBtn = (!ms.in_beta && (st === 'build' || st === 'review'))
    ? `<button class="btn gate" ${canLandBeta ? '' : 'disabled'} onclick="runAction('land_beta')" title="${esc(landBetaTip)}">🚀 Land on Beta</button>`
    : '';

  const li = t.land_info || {};
  const landMainTip = li.mode === 'sync_main'
    ? 'Sync shared agent/tooling files to origin/main (isolated tests, no collect.yml)'
    : (li.mode === 'deploy_main'
        ? (li.unpromoted_switch
            ? `Switch '${li.switch || ''}' is not yet in PROMOTED — will confirm before triggering collect.yml on main`
            : 'Trigger collect.yml on main and mark done')
        : 'Mark task landed on main (done)');
  const landMainBtn = (ms.in_beta && !ms.in_public)
    ? `<button class="btn gate" onclick="runAction('land_main')" title="${esc(landMainTip)}">🌍 Land on Main</button>`
    : '';

  const taskFiles = Array.isArray(t.task_files) && t.task_files.length
    ? t.task_files
    : [
        ...(t.plan_md ? [{ path: 'PLAN.md', group: 'root', name: 'PLAN.md', ext: '.md', size: t.plan_md.length }] : []),
        ...(t.task_md ? [{ path: 'TASK.md', group: 'root', name: 'TASK.md', ext: '.md', size: t.task_md.length }] : []),
        ...(t.handoff_md ? [{ path: 'HANDOFF.md', group: 'root', name: 'HANDOFF.md', ext: '.md', size: t.handoff_md.length }] : []),
        ...(t.mockups || []).map(f => ({ path: `mockups/${f}`, group: 'mockups', name: f, ext: f.includes('.') ? '.' + f.split('.').pop().toLowerCase() : '', size: 0 })),
        ...(t.evidence || []).map(f => ({ path: `evidence/${f}`, group: 'evidence', name: f, ext: f.includes('.') ? '.' + f.split('.').pop().toLowerCase() : '', size: 0 })),
      ];

  if (!ACTIVE_FILE || (!['PLAN.md', 'TASK.md', 'HANDOFF.md'].includes(ACTIVE_FILE) && !taskFiles.some(f => f.path === ACTIVE_FILE))) {
    ACTIVE_FILE = taskFiles.some(f => f.path === 'PLAN.md') ? 'PLAN.md' : (taskFiles[0]?.path || 'PLAN.md');
  }

  const fileUrl = (kind, f) => `/api/file?id=${encodeURIComponent(t.id)}&kind=${kind}&name=${encodeURIComponent(f)}`;
  const isMd = /\.md$/i.test(ACTIVE_FILE);
  const isHtmlMockup = /^mockups\/.+\.html?$/i.test(ACTIVE_FILE);
  const isImage = /^(mockups|evidence)\/.+\.(png|jpe?g|webp|gif|svg)$/i.test(ACTIVE_FILE);
  const isJson = /\.json$/i.test(ACTIVE_FILE);

  let toolbarBtns = '';
  let bodyHtml = '';
  let attachMockupSrc = '';

  if (EDITING === 'plan' || EDITING === 'handoff') {
    const label = EDITING === 'plan' ? 'PLAN.md' : 'HANDOFF.md';
    const rawVal = EDITING === 'plan' ? (t.plan_md || '') : (t.handoff_md || '');
    toolbarBtns = `
      <button class="btn primary" onclick="saveDoc('${EDITING}')">Save ${label}</button>
      <button class="btn" onclick="cancelEdit()">Cancel</button>`;
    bodyHtml = `<textarea class="editor" id="doc-editor">${esc(rawVal)}</textarea>`;
  } else {
    if (isMd) {
      toolbarBtns += `
        <div class="seg">
          <button class="${MD_MODE === 'rendered' ? 'active' : ''}" onclick="setMdMode('rendered')">Rendered</button>
          <button class="${MD_MODE === 'raw' ? 'active' : ''}" onclick="setMdMode('raw')">Raw</button>
        </div>`;
    }
    if (ACTIVE_FILE === 'PLAN.md') {
      toolbarBtns += `<button class="btn" onclick="startEdit('plan')">Edit</button>`;
    } else if (ACTIVE_FILE === 'HANDOFF.md') {
      toolbarBtns += `<button class="btn" onclick="runAction('snapshot_handoff')">Snapshot Git</button>
        <button class="btn" onclick="startEdit('handoff')">Edit</button>`;
    }

    if (ACTIVE_FILE === 'PLAN.md' || ACTIVE_FILE === 'TASK.md' || ACTIVE_FILE === 'HANDOFF.md') {
      const mdText = ACTIVE_FILE === 'PLAN.md'
        ? (t.plan_md || 'No PLAN.md')
        : ACTIVE_FILE === 'TASK.md'
          ? (t.task_md || 'No TASK.md')
          : (t.handoff_md || 'No HANDOFF.md yet. Optional sticky note — click Snapshot Git or Edit.');
      bodyHtml = MD_MODE === 'rendered'
        ? renderMarkdown(mdText)
        : `<pre class="doc">${esc(mdText)}</pre>`;
    } else if (isHtmlMockup) {
      const name = ACTIVE_FILE.slice('mockups/'.length);
      attachMockupSrc = fileUrl('mockups', name);
      bodyHtml = `<div id="mockup-host"></div>`;
    } else if (isImage) {
      const slashIdx = ACTIVE_FILE.indexOf('/');
      const kind = ACTIVE_FILE.slice(0, slashIdx);
      const name = ACTIVE_FILE.slice(slashIdx + 1);
      bodyHtml = `<div class="shots"><img src="${fileUrl(kind, name)}" alt="${esc(ACTIVE_FILE)}" /></div>`;
    } else if (ACTIVE_FILE === 'evidence/verify.json') {
      const usageHtml = renderUsageCard(t);
      const vJson = t.verify
        ? `<pre class="doc">${esc(JSON.stringify(t.verify, null, 2))}</pre>`
        : '<div class="empty">No <code>evidence/verify.json</code> yet. Run Verify to generate.</div>';
      bodyHtml = usageHtml + vJson;
    } else {
      const cacheKey = `${t.id}:${ACTIVE_FILE}`;
      const cached = FILE_CACHE[cacheKey];
      if (!cached) {
        fetchTaskFile(t.id, ACTIVE_FILE);
        bodyHtml = `<div class="empty">Loading <code>${esc(ACTIVE_FILE)}</code>...</div>`;
      } else if (cached.loading) {
        bodyHtml = `<div class="empty">Loading <code>${esc(ACTIVE_FILE)}</code>...</div>`;
      } else if (cached.error) {
        bodyHtml = `<div class="empty">${esc(cached.error)}</div>`;
      } else if (cached.binary) {
        bodyHtml = `<div class="empty">Binary file (${esc(ACTIVE_FILE)}).</div>`;
      } else if (isMd) {
        bodyHtml = MD_MODE === 'rendered'
          ? renderMarkdown(cached.content)
          : `<pre class="doc">${esc(cached.content)}</pre>`;
      } else if (isJson) {
        let pretty = cached.content;
        try { pretty = JSON.stringify(JSON.parse(cached.content), null, 2); } catch (_) {}
        bodyHtml = `<pre class="doc">${esc(pretty)}</pre>`;
      } else {
        bodyHtml = `<pre class="doc">${esc(cached.content)}</pre>`;
      }
    }
  }

  const fileGroups = [
    { key: 'root', label: 'Task Docs' },
    { key: 'mockups', label: 'Mockups' },
    { key: 'evidence', label: 'Evidence' },
  ];
  const fileBrowserHtml = fileGroups.map(g => {
    const items = taskFiles.filter(f => f.group === g.key);
    if (!items.length) return '';
    return `<div class="fb-grp">${g.label}</div>` + items.map(f => `
      <div class="fb-item ${f.path === ACTIVE_FILE ? 'active' : ''}" onclick="openTaskFile('${esc(f.path)}')" title="${esc(f.path)}">
        <span class="fb-name">${esc(f.name)}</span>
        <span class="fb-sz">${f.size ? esc(formatBytes(f.size)) : ''}</span>
      </div>`).join('');
  }).join('') || '<div class="empty" style="padding:10px;font-size:11.5px;">No task files</div>';

  const approvalText = t.plan_approved
    ? `${t.plan_approved_by || 'human'} · ${t.plan_approved_sha || ''}`
    : 'pending';
  const verifyText = t.verify ? (t.verify.ok ? 'Verified OK' : 'Verify Failed') : 'Unverified';
  const lastAgentText = t.handoff_meta?.last_agent || '—';
  const usageSummary = t.token_usage || t.usage?.summary || '';
  const usageTip = buildUsageTooltip(t.usage);

  el.innerHTML = `
    <div class="title-bar">
      <h2>#${esc(t.id)} — ${esc(t.title)}</h2>
      <div class="menu-wrap">
        <button class="btn ghost" onclick="toggleMenu('more-menu', event)" title="More actions">⋯</button>
        <div class="menu-pop right" id="more-menu">
          <button onclick="runAction('open_folder')">Open Task Folder</button>
          <button onclick="copyText('${esc(t.branch)}').then(() => showToast('Copied branch: ${esc(t.branch)}'))">Copy Branch Name</button>
          <button onclick="copyText('?beta=1&feat=${esc(t.switch)}').then(() => showToast('Copied Beta switch: ?beta=1&feat=${esc(t.switch)}'))">Copy Beta Switch</button>
          <button onclick="copyText('${esc(t.beta_url)}').then(() => showToast('Copied Beta URL'))">Copy Beta URL</button>
          ${t.active_worktree ? `<button onclick="runAction('start')">Refresh Brief</button>` : ''}
          <button onclick="runAction('reopen_plan')">Reopen Plan Gate</button>
        </div>
      </div>
    </div>
    ${renderSequence(t)}
    ${renderGateCallout(t)}
    <div class="action-row">
      ${primaryBtn}
      ${landBetaBtn}
      ${landMainBtn}
      <div class="menu-wrap">
        <button class="btn" onclick="toggleMenu('brief-menu', event)">Agent Brief ▾</button>
        <div class="menu-pop" id="brief-menu">
          <button onclick="copyResumePrompt(true)">Copy Worker Brief (${esc(t.exec_tier || 'hydrogen')})</button>
          <button onclick="copyResumePrompt(false)">Copy Resume Prompt</button>
          ${hasSidecarChat() ? '<button onclick="sendResumeToChat()">Send Brief to Active Chat</button>' : ''}
          ${hasClaude ? '<button onclick="runAction(\'launch_claude\')">Launch Fresh Claude</button>' : ''}
        </div>
      </div>
      ${extraBetaBtn}
    </div>
    ${renderConvoStrip(t)}
    <div class="details-panel ${DETAILS_OPEN ? 'open' : ''}">
      <div><div class="k">Branch</div><div class="v">${esc(t.branch)}</div></div>
      <div><div class="k">Exec Tier</div><div class="v">${esc(t.exec_tier || 'hydrogen')}</div></div>
      ${usageSummary ? `<div><div class="k">Token Usage</div><div class="v" title="${esc(usageTip)}">${esc(usageSummary)}</div></div>` : ''}
      <div><div class="k">Plan Approval</div><div class="v">${esc(approvalText)}</div></div>
      <div><div class="k">Beta Switch</div><div class="v">?beta=1&amp;feat=${esc(t.switch)}</div></div>
      <div><div class="k">Verify</div><div class="v">${esc(verifyText)}</div></div>
      <div><div class="k">Last Agent</div><div class="v">${esc(lastAgentText)}</div></div>
      <div style="grid-column:1/-1;"><div class="k">Owned Paths</div><div class="v">${esc((t.owned_paths || []).join(', ') || '—')}</div></div>
    </div>
    <div class="doc-workspace ${FILES_OPEN ? '' : 'no-files'}">
      <div class="doc-main">
        <div class="doc-toolbar">
          <span class="doc-title">${esc(ACTIVE_FILE)}</span>
          <div class="doc-actions">
            ${toolbarBtns}
            <button class="btn" onclick="toggleFiles()">Files (${taskFiles.length})</button>
          </div>
        </div>
        <div class="doc-pane">${bodyHtml}</div>
      </div>
      <aside class="file-browser ${FILES_OPEN ? 'open' : ''}">${fileBrowserHtml}</aside>
    </div>
  `;

  if (attachMockupSrc) {
    const host = document.getElementById('mockup-host');
    if (host) {
      host.appendChild(getPersistentMockupIframe(attachMockupSrc));
    }
  }
}

refresh(false);
setInterval(() => refresh(false), 4000);
</script>
</body>
</html>
